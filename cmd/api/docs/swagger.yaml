            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Listar grupos de un equipo
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: Crea un nuevo grupo dentro de un equipo. Solo el entrenador del
        equipo puede hacerlo
      parameters:
      - description: Datos del grupo
