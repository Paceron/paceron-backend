host: localhost:8080
info:
  contact:
    email: dev@example.com
    name: API Support
  description: Base scaffolding for Go APIs with Gin framework
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Simple Arq Golang API
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password. Returns access and refresh JWT tokens.
      parameters:
      - description: User credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Authenticate user and get tokens
      tags:
      - auth
  /api/v1/auth/permissions:
    get:
      description: Returns all permissions for a user grouped by role and tier
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_services.PermissionsQueryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Get user permissions
      tags:
      - permissions
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account. Password is sent in the request body
        (min 8 chars).
      parameters:
      - description: User registration data (password required)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Register a new user
      tags:
      - auth
  /api/v1/auth/user:
    get:
      consumes:
      - application/json
      description: Retrieve a user by providing either id or email as query parameter
        (not both).
      parameters:
      - description: User ID
        in: query
        name: id
        type: integer
      - description: User email
        in: query
        name: email
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Get user by ID or email
      tags:
      - auth
  /api/v1/permissions:
    get:
      description: Get all active permissions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/simple-arq-golang_cmd_api_domains_permission.PermissionResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Get all permissions
      tags:
      - permissions
    post:
      consumes:
      - application/json
      description: Creates a new permission with name and optional description
      parameters:
      - description: Permission data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/simple-arq-golang_cmd_api_domains_permission.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_permission.PermissionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Create a new permission
      tags:
      - permissions
  /api/v1/permissions/{id}:
    delete:
      description: Soft deletes a permission by ID
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_permission.DeletePermissionResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Delete a permission
      tags:
      - permissions
    get:
      description: Get a permission by its ID
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_permission.PermissionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Get permission by ID
      tags:
      - permissions
    put:
      consumes:
      - application/json
      description: Updates a permission by ID with optional fields
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/simple-arq-golang_cmd_api_domains_permission.UpdatePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_permission.PermissionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Update a permission
      tags:
      - permissions
  /api/v1/permissions/by-name:
    get:
      description: Get a permission by its unique name
      parameters:
      - description: Permission name
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_permission.PermissionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Get permission by name
      tags:
      - permissions
  /api/v1/roles:
    get:
      description: Get all active roles
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/simple-arq-golang_cmd_api_domains_role.RoleResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Get all roles
      tags:
      - roles
    post:
      consumes:
      - application/json
      description: Creates a new role with name and optional description
      parameters:
      - description: Role data
        in: body
        name: body
        required: true
        schema:
