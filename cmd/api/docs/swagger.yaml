info:
  contact:
    email: dev@example.com
    name: API Support
  description: Base scaffolding for Go APIs with Gin framework
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Simple Arq Golang API
  version: 1.0.0
paths:
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a 6-digit OTP code by email if it belongs to an active user.
        Always responds with the same generic message, to avoid leaking whether an
        email is registered.
      parameters:
      - description: Email to send the reset code to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.ForgotPasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Request a password reset code
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password. Returns access and refresh JWT tokens.
      parameters:
      - description: User credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Authenticate user and get tokens
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revoca el refresh token indicado. El access token sigue válido
        hasta su expiración natural
      parameters:
      - description: Refresh token a revocar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.LogoutResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Cerrar sesión
      tags:
      - auth
  /api/v1/auth/permissions:
    get:
      description: Returns all permissions for a user grouped by role and tier
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_services.PermissionsQueryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Get user permissions
      tags:
      - permissions
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Rota un refresh token activo: lo revoca y emite un access + refresh
        nuevos'
      parameters:
      - description: Refresh token vigente
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.RefreshResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Renovar sesión
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account. Password is sent in the request body
        (min 8 chars).
      parameters:
      - description: User registration data (password required)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Register a new user
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Validates the OTP code sent via forgot-password and updates the
        user's password.
      parameters:
      - description: Email, code, new password and confirmation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.ResetPasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Reset password using an OTP code
      tags:
      - auth
  /api/v1/auth/user:
    get:
      consumes:
      - application/json
      description: Retrieve a user by providing either id or email as query parameter
        (not both).
      parameters:
      - description: User ID
        in: query
        name: id
        type: integer
      - description: User email
        in: query
        name: email
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_auth.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/simple-arq-golang_cmd_api_domains_apierror.APIError'
      summary: Get user by ID or email
      tags:
      - auth
  /api/v1/groups:
    get:
      description: Devuelve los grupos de un equipo. Si se filtra por team_id, valida
        que el usuario autenticado sea miembro
      parameters:
      - description: ID del equipo
        in: query
        name: team_id
