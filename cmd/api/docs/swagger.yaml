basePath: /
definitions:
  apierror.APIError:
    properties:
      code:
        type: string
      message:
        type: string
      status_code:
        type: integer
    type: object
  auth.AuthorizationData:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      authorization:
        $ref: '#/definitions/auth.AuthorizationData'
      user:
        $ref: '#/definitions/auth.RegisterResponse'
    type: object
  auth.RegisterRequest:
    properties:
      birth_date:
        type: string
      city:
        type: string
      country:
        type: string
      dni:
        type: string
      email:
        type: string
      name:
        type: string
      number:
        type: string
      password:
        type: string
      phone:
        type: string
      phone_contact:
        type: string
      province:
        type: string
      street:
        type: string
      surname:
        type: string
    required:
    - birth_date
    - dni
    - email
    - name
    - password
    - surname
    type: object
  auth.RegisterResponse:
    properties:
      birth_date:
        type: string
      city:
        type: string
      country:
        type: string
      dni:
        type: string
      email:
        type: string
      name:
        type: string
      number:
        type: string
      phone:
        type: string
      phone_contact:
        type: string
      province:
        type: string
      status:
        type: string
      street:
        type: string
      surname:
        type: string
      user_id:
        type: integer
    type: object
  user.StatusChangeRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  user.UserUpdateRequest:
    properties:
      birth_date:
        type: string
      city:
        type: string
      country:
        type: string
      dni:
        type: string
      email:
        type: string
      name:
        type: string
      number:
        type: string
      phone:
        type: string
      phone_contact:
        type: string
      province:
        type: string
      street:
        type: string
      surname:
        type: string
    type: object
  user.UserUpdateResponse:
    properties:
      birth_date:
        type: string
      city:
        type: string
      country:
        type: string
      dni:
        type: string
      email:
        type: string
      name:
        type: string
      number:
        type: string
      phone:
        type: string
      phone_contact:
        type: string
      province:
        type: string
      status:
        type: string
      street:
        type: string
      surname:
        type: string
      user_id:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: dev@paceron.com
    name: API Support
  description: API para el registro y gestión de usuarios de Paceron
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Paceron Backend API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password. Returns access and refresh JWT tokens.
      parameters:
      - description: User credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.APIError'
      summary: Authenticate user and get tokens
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account. Password is sent in the request body
        (min 8 chars).
      parameters:
      - description: User registration data (password required)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.APIError'
      summary: Register a new user
      tags:
      - auth
  /api/v1/auth/user:
    get:
      consumes:
      - application/json
      description: Retrieve a user by providing either id or email as query parameter
        (not both).
      parameters:
      - description: User ID
        in: query
        name: id
        type: integer
      - description: User email
        in: query
        name: email
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.APIError'
      summary: Get user by ID or email
      tags:
      - auth
  /api/v1/users/{id}:
    put:
      consumes:
      - application/json
      description: Update user attributes (all fields except id, status). Email change
        requires X-Current-Password header.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Current password (required for email change)
        in: header
        name: X-Current-Password
        type: string
      - description: User data to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UserUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserUpdateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.APIError'
      summary: Update user attributes
      tags:
      - users
  /api/v1/users/{id}/status:
    patch:
      consumes:
      - application/json
      description: 'Change the status of a user. Valid statuses: active, inactive,
        pause, blocked, suspended.'
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.StatusChangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserUpdateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.APIError'
      summary: Change user status
      tags:
      - users
  /ping:
    get:
      description: Returns pong if the server is running
      responses:
        "200":
          description: pong
          schema:
            type: string
      summary: Health check
      tags:
      - health
swagger: "2.0"
