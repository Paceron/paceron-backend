services:
  - type: web
    name: paceron-backend
    runtime: go
    repo: https://github.com/Paceron/paceron-backend
    branch: main
    plan: free
    buildCommand: go build -o main ./cmd/api
    startCommand: ./main
    healthCheckPath: /ping
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: GIN_MODE
        value: release
      - key: CORS_ALLOWED_ORIGINS
        value: "https://paceron-frontend.onrender.com,https://paceron-frontend.vercel.app,https://paceron-frontend-git-develop-paceron.vercel.app,http://localhost:8081,http://localhost:5173,http://localhost:3000"
