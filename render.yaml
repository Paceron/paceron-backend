services:
  # Producción real. Master + --stage=production explícito: sin el flag, el
  # binario cae en testing stage por default (ver docs/ENVIRONMENTS.md) — el
  # flag tiene que estar sí o sí acá, no es opcional ni redundante.
  - type: web
    name: paceron-backend
    runtime: go
    repo: https://github.com/Paceron/paceron-backend
    branch: master
    plan: free
    buildCommand: go build -o app ./cmd/api
    startCommand: ./app --stage=production
    healthCheckPath: /ping
    envVars:
      - key: SUPABASE_PRODUCTION_DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: GIN_MODE
        value: release
      - key: CORS_ALLOWED_ORIGINS
        value: "https://paceron-frontend.onrender.com,https://paceron-frontend.vercel.app,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:5173,http://localhost:3000"
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      # Mercado Pago OAuth (mp-connect). Las cuatro van con sync: false porque ya
      # están cargadas en el dashboard y su valor es específico del entorno —
      # declararlas acá cumple la regla de "toda key que el binario necesita vive
      # en render.yaml" sin pisar una config productiva que funciona.
      # MP_OAUTH_REDIRECT_URI en particular tiene que coincidir EXACTA con la
      # registrada en el panel de Mercado Pago.
      - key: MP_OAUTH_CLIENT_ID
        sync: false
      - key: MP_OAUTH_CLIENT_SECRET
        sync: false
      - key: MP_OAUTH_REDIRECT_URI
        sync: false
      - key: MP_OAUTH_TEST_TOKEN
        sync: false
      # Segundo salto: a dónde manda el backend al navegador después de procesar
      # el callback. No se registran en Mercado Pago (MP nunca las ve). Cuál se
      # usa lo decide el target del state — ver domains/mpconnect/state.go.
      - key: MP_OAUTH_WEB_RETURN_URL
        value: "https://paceron-frontend.vercel.app/mp-connect/callback"
      - key: MP_OAUTH_APP_RETURN_URL
        value: "paceron://mp-connect/callback"

  # Preview de develop, contra testing stage (default, sin flag). Mismo repo,
  # otro branch — sirve para probar develop desplegado sin tocar producción.
  - type: web
    name: paceron-backend-develop
    runtime: go
    repo: https://github.com/Paceron/paceron-backend
    branch: develop
    plan: free
    buildCommand: go build -o app ./cmd/api
    startCommand: ./app
    healthCheckPath: /ping
    envVars:
      - key: SUPABASE_TESTING_DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: GIN_MODE
        value: release
      - key: CORS_ALLOWED_ORIGINS
        value: "https://paceron-frontend.onrender.com,https://paceron-frontend.vercel.app,https://paceron-frontend-git-develop-paceron.vercel.app,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:5173,http://localhost:3000"
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      # Mercado Pago OAuth (mp-connect). Las cuatro van con sync: false porque ya
      # están cargadas en el dashboard y su valor es específico del entorno —
      # declararlas acá cumple la regla de "toda key que el binario necesita vive
      # en render.yaml" sin pisar una config productiva que funciona.
      # MP_OAUTH_REDIRECT_URI en particular tiene que coincidir EXACTA con la
      # registrada en el panel de Mercado Pago.
      - key: MP_OAUTH_CLIENT_ID
        sync: false
      - key: MP_OAUTH_CLIENT_SECRET
        sync: false
      - key: MP_OAUTH_REDIRECT_URI
        sync: false
      - key: MP_OAUTH_TEST_TOKEN
        sync: false
      # Segundo salto: a dónde manda el backend al navegador después de procesar
      # el callback. No se registran en Mercado Pago (MP nunca las ve). Cuál se
      # usa lo decide el target del state — ver domains/mpconnect/state.go.
      - key: MP_OAUTH_WEB_RETURN_URL
        value: "https://paceron-frontend-git-develop-paceron.vercel.app/mp-connect/callback"
      - key: MP_OAUTH_APP_RETURN_URL
        value: "paceron-dev://mp-connect/callback"
