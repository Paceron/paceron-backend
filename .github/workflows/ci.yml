name: CI

on:
  push:
    branches:
      - master
      - develop
      - feature/**
      - release/**
      - fix/**
      - hotfix/**
      - backport/**
      - chore/**
  pull_request:
    branches:
      - master
      - develop
      - release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test paceron-backend
    runs-on: ubuntu-latest

    # Postgres real para los tests de daos/ (antes solo se testeaba conformidad de
    # interfaz, sin DB). postgres:16-alpine: la imagen oficial mas liviana, container
    # descartable por job, no persiste entre corridas. Ver docs/TESTING.md.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paceron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_NAME: paceron_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./... -v

      - name: Measure test coverage
        run: |
          mkdir -p ci/test_coverage
          go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./... | xargs go test -coverpkg=./... -coverprofile=ci/test_coverage/coverage.out -covermode=atomic

      - name: Coverage summary
        if: always()
        run: |
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=ci/test_coverage/coverage.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: ci/test_coverage/coverage.out
          config: ./.testcoverage.yml
