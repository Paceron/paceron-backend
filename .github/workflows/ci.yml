name: CI

on:
  push:
    branches:
      - master
      - develop
      - feature/**
      - release/**
      - fix/**
      - hotfix/**
      - backport/**
      - chore/**
  pull_request:
    branches:
      - master
      - develop
      - release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test paceron-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./... -v
