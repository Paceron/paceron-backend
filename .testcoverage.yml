# Config de vladopajic/go-test-coverage.
#
# threshold.total en 80: bloquea el merge si el coverage total cae por debajo.
# Alcanzado con Postgres real en CI para testear daos/ (antes en ~4%, ahora >85%),
# ver docs/TESTING.md. Total real hoy: ~85% — deja margen antes de romper CI por
# ruido menor. No bajar este numero para pasar el gate — si baja, es porque se
# borro/dejo sin testear codigo con logica real, hay que agregar tests, no
# ajustar el umbral hacia abajo.
threshold:
  file: 0
  package: 0
  total: 80

# Paquetes sin logica real (structs/DTOs puros, constantes, codigo autogenerado,
# wiring de arranque, helpers de test) - se excluyen del calculo por completo,
# no cuentan ni para bien ni para mal. Un paquete CON logica real y 0% de tests
# nunca va aca, se deja contar como deuda visible a proposito (ver CLAUDE.md).
exclude:
  paths:
    - ^cmd/api/main\.go$
    - ^cmd/api/docs/
    - ^cmd/api/testutils/
    - ^cmd/api/constants/
    - ^cmd/api/domains/apierror/
    - ^cmd/api/domains/dbs/
    - ^cmd/api/domains/user/
    - ^cmd/api/domains/auth/
    - ^cmd/api/domains/exampleweather/
