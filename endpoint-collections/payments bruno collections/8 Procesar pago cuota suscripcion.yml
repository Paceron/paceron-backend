info:
  name: 8 Procesar pago cuota suscripcion
  type: http
  seq: 8

http:
  method: POST
  url: http://localhost:8080/api/v1/payments
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "token": "{{card_token}}",
        "transaction_amount": {{installment_amount}},
        "payment_method_id": "master",
        "installments": 1,
        "payer_email": "{{payer_email}}",
        "preference_id": "{{preference}}",
        "installment_id": {{installment_id}}
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true