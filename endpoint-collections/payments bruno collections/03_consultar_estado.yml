info:
  name: Consultar estado del pago
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:8080/api/v1/payments/1?Authorization=Bearer {{token}}
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: Authorization
      value: Bearer {{token}}
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
