info:
  name: 7 Crear preferencia cuota suscripcion
  type: http
  seq: 7

http:
  method: POST
  url: http://localhost:8080/api/v1/payments/preference
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "concept": "subscription",
        "description": "Cuota de suscripcion de tier",
        "items": [
          {
            "title": "Cuota mensual tier",
            "quantity": 1,
            "unit_price": {{installment_amount}}
          }
        ],
        "installment_id": {{installment_id}}
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setVar("preference", body.preference_id);
        bru.setVar("public_key", body.public_key);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true