info:
  name: 6 Consultar suscripcion actual
  type: http
  seq: 6

http:
  method: GET
  url: http://localhost:8080/api/v1/users/{{user_id}}/subscriptions/current?role_id={{role_id}}
  headers:
    - name: Authorization
      value: Bearer {{token}}

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.installment_id) {
          bru.setVar("installment_id", body.installment_id);
          bru.setVar("installment_amount", body.installment_amount);
          console.log("installment_id:", bru.getVar("installment_id"));
          console.log("installment_amount:", bru.getVar("installment_amount"));
        } else {
          console.log("sin cuota pendiente (rol gratis o sin suscripcion)");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true