info:
  name: 03 - Buscar asistencias
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8080/api/v1/attendance/search
  query:
    team_id: "1"
    training_session_id: "1"
    user_id: "1"
  headers:
    - name: Authorization
      value: Bearer {{token}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true