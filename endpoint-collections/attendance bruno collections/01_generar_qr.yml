info:
  name: 01 - Generar QR de asistencia
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/api/v1/attendance/qr
  query:
    team_id: "1"
    training_session_id: "1"
  headers:
    - name: Authorization
      value: Bearer {{token}}

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.url_encoded) {
          console.log("URL:", body.url_encoded);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true