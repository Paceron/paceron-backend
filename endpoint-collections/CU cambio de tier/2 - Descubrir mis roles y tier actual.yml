info:
  name: 2 - Descubrir mis roles y tier actual
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/api/v1/auth/permissions?user_id={{user_id}}
  headers:
    - name: Authorization
      value: Bearer {{token}}

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.roles && body.roles.length > 0) {
          // El front elige el rol a subir; aca tomamos el primero.
          const role = body.roles[0];
          bru.setVar("role_id", role.id);
          bru.setVar("current_tier", role.tier);
          console.log("role_id:", bru.getVar("role_id"));
          console.log("current_tier:", bru.getVar("current_tier"));
        } else {
          console.log("sin roles asignados");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true