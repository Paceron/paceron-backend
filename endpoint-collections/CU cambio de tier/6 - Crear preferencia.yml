info:
  name: 6 - Crear preferencia
  type: http
  seq: 6

http:
  method: POST
  url: http://localhost:8080/api/v1/payments/preference
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "concept": "subscription",
        "description": "Cuota de suscripcion de tier",
        "items": [
          {
            "title": "Cuota mensual tier",
            "quantity": 1,
            "unit_price": {{installment_amount}}
          }
        ],
        "installment_id": {{installment_id}}
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.preference_id) {
          bru.setVar("preference", body.preference_id);
          if (body.public_key) {
            bru.setVar("public_key", body.public_key);
          }
          console.log("preference:", bru.getVar("preference"));
        } else {
          console.log("no se obtuvo preference_id");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true