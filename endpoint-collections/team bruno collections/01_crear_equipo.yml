info:
  name: crear equipo con grupo default
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/teams
  body:
    type: json
    data: |-
      {
        "name": "Equipo Alpha",
        "description": "Equipo principal de entrenamiento",
        "level": "avanzado",
        "max_members": 20,
        "requirements": "Experiencia previa en competiciones",
        "owner_id": 1,
        "create_default_group": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
