info:
  name: get users permisssions
  type: http
  seq: 11

http:
  method: get
  url: http://localhost:8080/api/v1/auth/permissions
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
