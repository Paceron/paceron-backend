info:
  name: 1 - Login coach (entrenador)
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/auth/login
  body:
    type: json
    data: |-
      {
        "email": "entrenador@example.com",
        "password": "Abcd-12345"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setVar("coach_token", body.access_token);
        bru.setVar("coach_user_id", body.user.user_id);
        console.log("coach_token:", bru.getVar("coach_token"));
        console.log("coach_user_id:", bru.getVar("coach_user_id"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true