info:
  name: 2 - Generar URL de autorizacion OAuth
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/api/v1/mercadopago/connect
  headers:
    - name: Authorization
      value: Bearer {{coach_token}}

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.auth_url) {
          bru.setVar("oauth_state", body.state);
          console.log("auth_url:", body.auth_url);
          console.log("state:", body.state);
          console.log("");
          console.log(">>> ABRI EL SIGUIENTE ENLACE EN UN NAVEGADOR MANUAL, LOGUEATE CON EL TEST SELLER DE MP Y COMPLETA LA AUTORIZACION,");
          console.log(">>> OK: copia el code de esa URL y ejecuta el request '3' (opcional) o espera");
          console.log(">>> ");
          console.log(">>> " + body.auth_url);
          console.log(">>> ");
          console.log(">>> La URL de callback (redirige a MP_OAUTH_REDIRECT_URI) tiene este formato:");
          console.log(">>>   "+body.auth_url.replace(/^https:\/\/auth\.mercadopago\.com\/authorization\?.*$/,'<MP_OAUTH_REDIRECT_URI>')+"?code=DGTZ-XXXXXXXX&state=<coach_user_id>-<timestamp>");
        } else {
          console.log("sin auth_url: configurar MP_OAUTH_CLIENT_ID y MP_OAUTH_REDIRECT_URI en el backend (Render), ver docs de onboarding");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true