info:
  name: 2 - Descubrir mi equipo
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/api/v1/teams?member_id={{user_id}}
  headers:
    - name: Authorization
      value: Bearer {{token}}

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (Array.isArray(body) && body.length > 0) {
          bru.setVar("team_id", body[0].id);
          console.log("team_id:", bru.getVar("team_id"));
          console.log("equipo:", body[0].name);
        } else {
          console.log("el miembro no pertenece a ningun equipo (agregarlo con POST /api/v1/teams/:id/users)");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true